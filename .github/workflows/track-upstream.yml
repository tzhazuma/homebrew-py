name: Track Homebrew upstream

on:
  schedule:
    # Mondays 01:00 UTC = 09:00 Asia/Shanghai
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/track_upstream.py \
            --state .upstream-state.json \
            --report upstream-report.md \
            --repo "${{ github.repository }}" \
            --open-issue
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-report
          path: upstream-report.md
          if-no-files-found: ignore
      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .upstream-state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update Homebrew upstream tracking state"
            git push
          fi
